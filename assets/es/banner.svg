<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .m{font-family:Consolas,'JetBrains Mono',Menlo,monospace}
      .pulse{animation:p 3s ease-in-out infinite}
      .d1{animation-delay:.6s}.d2{animation-delay:1.2s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:f 4s linear infinite}
      @keyframes f{to{stroke-dashoffset:-160}}
      .in{animation:i 1.2s ease-out both}
      @keyframes i{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- Network topology: networking / Industry 4.0 motif -->
  <g fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.55">
    <path class="flow" d="M820 90 L930 150 L1060 100"/>
    <path class="flow" d="M930 150 L900 250 L1040 240"/>
    <path class="flow" d="M1060 100 L1130 190 L1040 240"/>
    <path class="flow" d="M820 90 L760 200 L900 250"/>
    <path class="flow" d="M930 150 L1040 240"/>
  </g>
  <g fill="#0F172A" stroke-width="2">
    <circle class="pulse"    cx="820"  cy="90"  r="8"  stroke="#60A5FA"/>
    <circle class="pulse d1" cx="930"  cy="150" r="12" stroke="#A78BFA"/>
    <circle class="pulse d2" cx="1060" cy="100" r="8"  stroke="#60A5FA"/>
    <circle class="pulse d3" cx="900"  cy="250" r="9"  stroke="#60A5FA"/>
    <circle class="pulse d4" cx="1040" cy="240" r="11" stroke="#A78BFA"/>
    <circle class="pulse d2" cx="1130" cy="190" r="7"  stroke="#60A5FA"/>
    <circle class="pulse d1" cx="760"  cy="200" r="7"  stroke="#60A5FA"/>
  </g>
  <circle cx="930" cy="150" r="4" fill="#A78BFA"/>
  <circle cx="1040" cy="240" r="4" fill="#A78BFA"/>

  <g class="in">
    <text x="70" y="88" class="m" font-size="15" fill="#60A5FA" letter-spacing="2">&lt;/&gt;  FULL-STACK DEVELOPER  ·  CREADOR DE VIGÍA</text>
    <text x="68" y="158" class="t" font-size="60" font-weight="800" fill="url(#name)">Fabián Carrillo Méndez</text>
    <rect x="70" y="180" width="340" height="3" rx="1.5" fill="url(#bar)"/>
    <text x="70" y="220" class="t" font-size="20" fill="#CBD5E1">Estudiante de Ingeniería en Desarrollo de Software</text>
    <text x="70" y="250" class="t" font-size="17" fill="#94A3B8">Técnico Medio en Desarrollo Web  ·  San José, Costa Rica</text>
  </g>

  <g class="m" font-size="13" font-weight="600">
    <rect x="70"  y="276" width="118" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <text x="129" y="296" text-anchor="middle" fill="#93C5FD">Full-Stack</text>
    <rect x="198" y="276" width="128" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <text x="262" y="296" text-anchor="middle" fill="#C4B5FD">Industria 4.0</text>
    <rect x="336" y="276" width="96"  height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <text x="384" y="296" text-anchor="middle" fill="#93C5FD">Redes</text>
    <rect x="442" y="276" width="86"  height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <text x="485" y="296" text-anchor="middle" fill="#FDE68A">Linux</text>
    <rect x="538" y="276" width="140" height="30" rx="15" fill="#1E293B" stroke="#334155"/>
    <text x="608" y="296" text-anchor="middle" fill="#6EE7B7">IA aplicada</text>
  </g>
</svg>
